[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aleph"
version = "0.1.0"
description = "Plataforma soberana de OSINT y Cyber Threat Intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "stix2>=3.0",
    "pillow>=10.3",
    "imagehash>=4.3",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
prod = ["psycopg[binary]>=3.2", "redis>=5.0", "arq>=0.26"]

[tool.setuptools.packages.find]
include = ["aleph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
