# 8101: consola simple · 8102: consola completa. Las dos hablan con la misma API por /api.

server {
    listen 8101;
    root /usr/share/nginx/simple;
    include /etc/nginx/conf.d/aleph-common.inc;
}

server {
    listen 8102;
    root /usr/share/nginx/completa;
    include /etc/nginx/conf.d/aleph-common.inc;
}
